
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Returns | LNCT Library Admin</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>

<!-- Common Dynamic Navbar -->
<div id="site-navbar"></div>

<!-- Main Content -->
<main class="page">

    <section class="page-header">
        <div>
            <span class="eyebrow">ADMIN PANEL</span>
            <h1>Book Returns</h1>
            <p>
                Manage issued books and process their returns.
            </p>
        </div>
    </section>

    <!-- Message -->
    <div
            id="message"
            class="message hidden"
            role="alert"
    ></div>

    <!-- Return Records -->
    <section class="content-card">

        <h2>Issued Books</h2>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Book</th>
                    <th>Issue Date</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody id="issues-body">
                <tr>
                    <td colspan="5">
                        Loading return records...
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </section>

</main>

<!-- Common Footer -->
<div id="site-footer"></div>

<!-- JavaScript -->
<script src="/js/navbar.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/main.js"></script>
<script src="/js/returns.js"></script>

</body>
</html>
