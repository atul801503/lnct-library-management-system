
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | LNCT Library</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

<!-- Admin Sidebar -->
<aside class="sidebar">

    <a class="brand" href="/">
        <span class="brand-mark">L</span>
        <span>
        LNCT
        <small>ADMIN</small>
      </span>
    </a>

    <nav>
        <a class="side-link" href="/admin/index.html">
            Overview
        </a>

        <a class="side-link" href="/admin/books.html">
            Manage Books
        </a>

        <a class="side-link active" href="/admin/students.html">
            Students
        </a>

        <a class="side-link" href="/admin/issue-books.html">
            Issues &amp; Returns
        </a>

        <a class="side-link" href="/admin/returns.html">
            Returns
        </a>

        <a class="side-link" href="/admin/fines.html">
            Fines
        </a>

        <a class="side-link" href="/admin/reports.html">
            Reports
        </a>

        <a class="side-link" href="/admin/settings.html">
            Settings
        </a>

        <button
                type="button"
                id="logout-btn"
                class="side-link">
            Log Out
        </button>
    </nav>

</aside>

<!-- Main Content -->
<main class="app-main">

    <header class="app-header">

      <span class="eyebrow">
        LNCT LIBRARY ADMIN
      </span>

        <h1>Students Management</h1>

        <p>
            View registered students and manage their library accounts.
        </p>

    </header>

    <!-- Message -->
    <div
            id="message"
            class="message hidden"
            role="status"
            aria-live="polite">
    </div>

    <!-- Search and Refresh -->
    <section class="content-card">

        <div class="card-heading">
            <h2>Student Records</h2>

            <button
                    type="button"
                    id="refresh-students"
                    class="btn btn-light">
                Refresh
            </button>
        </div>

        <div class="toolbar">

            <input
                    type="search"
                    id="student-search"
                    placeholder="Search name, student ID or email..."
                    aria-label="Search students">

        </div>

        <!-- Students Table -->
        <div class="table-wrap">

            <table>

                <thead>
                <tr>
                    <th>Name</th>
                    <th>Student ID</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Semester</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody id="students-body">

                <tr>
                    <td colspan="7">
                        Loading students...
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

<!-- JavaScript -->
<script src="/js/main.js"></script>
<script src="/js/admin.js"></script>

</body>
</html>
