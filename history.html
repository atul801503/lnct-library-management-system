
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Issue History | LNCT Library</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>

<!-- Common Dynamic Navbar -->
<div id="site-navbar"></div>

<!-- Main Content -->
<main class="page">

    <section class="page-header">
        <span class="eyebrow">LNCT LIBRARY</span>

        <h1>Issue History</h1>

        <p>
            View your previously issued and returned books.
        </p>
    </section>

    <!-- History Records -->
    <section class="content-card">

        <h2>My Book History</h2>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Book</th>
                    <th>Issue Date</th>
                    <th>Due Date</th>
                    <th>Return Date</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody id="history-body">
                <tr>
                    <td colspan="5">
                        Loading history...
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </section>

</main>

<!-- Common Footer -->
<div id="site-footer"></div>

<!-- JavaScript -->
<script src="/js/navbar.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/main.js"></script>
<script src="/js/returns.js"></script>

</body>
</html>
